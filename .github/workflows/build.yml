name: Build PS2 ELF

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - name: Install dependencies
        run: |
          apk add build-base git zip cmake pkgconfig

      - uses: actions/checkout@v4

      - name: Build and Install gsKit
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin
          git clone https://github.com/ps2dev/gsKit.git /tmp/gsKit
          cd /tmp/gsKit
          make
          make install
          # کپی دستی فایل‌های ساخته شده به مسیر پیش‌فرض PS2SDK
          find /tmp/gsKit -name "*.a" -exec cp {} $PS2SDK/ports/lib/ \;

      - name: Build Game
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin
          make clean
          make

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: snake-ps2-elf
          path: snake_ps2.elf
